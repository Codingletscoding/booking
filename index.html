<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楽動羽球</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://script.google.com/macros/s/AKfycbzEgH-9zNLvzhNzsZISAc6a3IY4ojbMhpYDUPOgkFElBt1pqTYhJINyaezPfEjMlo9KLA/exec';
        const LIFF_ID = '2012115245-A7HBSYsv';

        const LEVEL_NAMES = { 1: '普通', 2: 'VIP', 3: 'VVIP', 4: 'SVVIP', 5: 'GVIP' };

        const getVIPDiscount = (lvl) => {
            const l = Number(lvl);
            if(l === 2) return 0.98;
            if(l === 3) return 0.95;
            if(l === 4) return 0.90;
            if(l === 5) return 0.88;
            return 1;
        };

        const generateTimeOptions = () => {
            const times = [];
            for (let h = 6; h <= 23; h++) {
                const hour = h.toString().padStart(2, '0');
                times.push(`${hour}:00`, `${hour}:30`);
            }
            return times;
        };
        const timeOptions = generateTimeOptions();

        const formatDate = (dateObj) => {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const getDayOfWeek = (dateString) => {
            if (!dateString) return '';
            const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            return days[new Date(dateString).getDay()];
        };

        // 【核心升級】自動計算該月份包含幾個該星期
        const getMonthlyDatesInfo = (startDateStr) => {
            if (!startDateStr) return { text: '', count: 0 };
            const d = new Date(startDateStr);
            const year = d.getFullYear();
            const month = d.getMonth();
            const targetDayOfWeek = d.getDay(); // 取得是星期幾

            const dates = [];
            // 從該月 1 號檢查到 31 號
            for (let day = 1; day <= 31; day++) {
                const tempDate = new Date(year, month, day);
                // 如果月份跳到下個月，代表這個月結束了，提早跳出迴圈
                if (tempDate.getMonth() !== month) break; 
                // 如果星期幾符合，就加入清單
                if (tempDate.getDay() === targetDayOfWeek) {
                    dates.push(`${tempDate.getMonth() + 1}/${tempDate.getDate()}`);
                }
            }
            return {
                text: `${dates.join(', ')} (${getDayOfWeek(startDateStr)})`,
                count: dates.length // 這裡會自動算出是 4 堂還是 5 堂
            };
        };

        const doesSlotMatchDate = (slot, dateStr) => {
            if (slot.date.startsWith(dateStr)) return true;
            const d = new Date(dateStr);
            const m = d.getMonth() + 1;
            const day = d.getDate();
            const md1 = `${m}/${day}`;
            const md2 = `${String(m).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
            const tokens = slot.date.split(/[\s,()]+/);
            return tokens.includes(md1) || tokens.includes(md2);
        };

        const fetchAPI = async (payload) => {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          return res.json();
        };

        const App = () => {
          const [liffState, setLiffState] = useState({ init: false, profile: null });
          const [userRecord, setUserRecord] = useState(null);
          const [view, setView] = useState('loading');

          useEffect(() => {
            liff.init({ liffId: LIFF_ID }).then(() => {
              if (!liff.isLoggedIn()) liff.login();
              else {
                liff.getProfile().then(profile => {
                  setLiffState({ init: true, profile });
                  checkUser(profile.userId);
                });
              }
            }).catch(() => {
              const mockProfile = { userId: 'U12345678', displayName: '測試用戶' };
              setLiffState({ init: true, profile: mockProfile });
              checkUser(mockProfile.userId);
            });
          }, []);

          const checkUser = async (lineId) => {
            const res = await fetchAPI({ action: 'checkUser', lineId });
            if (res.isAdmin) setView('coach');
            else if (res.isRegistered) { setUserRecord(res.user); setView('student'); } 
            else setView('register');
          };

          if (view === 'loading') return <div className="p-10 text-center text-gray-500">系統載入中...</div>;
          if (view === 'register') return <RegisterView profile={liffState.profile} onRegistered={(u) => { setUserRecord(u); setView('student'); }} />;
          if (view === 'student') return <StudentBookingView profile={liffState.profile} userRecord={userRecord} />;
          if (view === 'coach') return <CoachDashboard />;
        };

        // --- 學生：首次註冊 ---
        const RegisterView = ({ profile, onRegistered }) => {
          const [form, setForm] = useState({ name: profile.displayName || '', age: '', phone: '' });
          const [submitting, setSubmitting] = useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setSubmitting(true);
            await fetchAPI({ action: 'registerUser', lineId: profile.userId, ...form });
            onRegistered({ ...form, level: 1 });
          };

          return (
            <div className="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-md">
              <h2 className="text-2xl font-bold mb-2">哈囉！首次登入請綁定資料</h2>
              <form onSubmit={handleSubmit} className="space-y-4 mt-4">
                <div><label className="block text-sm mb-1">真實姓名</label><input required className="w-full border p-2 rounded" value={form.name} onChange={e=>setForm({...form, name: e.target.value})} /></div>
                <div><label className="block text-sm mb-1">年齡</label><input required type="number" className="w-full border p-2 rounded" value={form.age} onChange={e=>setForm({...form, age: e.target.value})} /></div>
                <div><label className="block text-sm mb-1">聯絡電話</label><input required type="tel" className="w-full border p-2 rounded" value={form.phone} onChange={e=>setForm({...form, phone: e.target.value})} /></div>
                <button type="submit" disabled={submitting} className="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold">{submitting ? '綁定中...' : '確認綁定'}</button>
              </form>
            </div>
          );
        };

        // --- 學生：預約頁面 ---
        const StudentBookingView = ({ profile, userRecord }) => {
          const [slots, setSlots] = useState([]);
          const [status, setStatus] = useState('idle');
          const [currentMonth, setCurrentMonth] = useState(new Date());
          const [selectedDate, setSelectedDate] = useState(formatDate(new Date()));
          const userLevel = userRecord.level || 1;

          useEffect(() => {
            fetchAPI({ action: 'getSlots' }).then(res => setSlots(res.slots || []));
          }, []);

          const handleBook = async (slot, type = null, customPrice = null) => {
            const myPrice = customPrice || slot.prices[userLevel];
            const titleDisplay = type ? `開放教練時段 (${type})` : slot.title;
            
            if (!confirm(`確定預約 ${titleDisplay}\n時間：${slot.date} ${slot.time}\n專屬費用：NT$ ${myPrice}`)) return;
            setStatus('booking');
            
            const finalName = type ? `${userRecord.name} [${type}]` : userRecord.name;
            await fetchAPI({ action: 'bookClass', slotId: slot.id, lineId: profile.userId, name: finalName, paidPrice: myPrice });
            setStatus('success');
          };

          const year = currentMonth.getFullYear();
          const month = currentMonth.getMonth();
          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const allCells = [...Array.from({ length: firstDay }, () => null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];

          const nextMonth = () => setCurrentMonth(new Date(year, month + 1, 1));
          const prevMonth = () => setCurrentMonth(new Date(year, month - 1, 1));

          const dailySlots = slots.filter(s => doesSlotMatchDate(s, selectedDate) && s.remaining > 0);

          if (status === 'success') return (
            <div className="max-w-md mx-auto mt-10 p-8 text-center bg-white rounded-xl shadow-md">
              <h2 className="text-2xl font-bold text-emerald-600 mb-4">預約成功！</h2>
              <button onClick={() => window.location.reload()} className="bg-gray-800 text-white px-6 py-2 rounded">返回行事曆</button>
            </div>
          );

          return (
            <div className="max-w-md mx-auto bg-gray-50 min-h-screen pb-10">
              <div className="bg-slate-800 p-6 text-white">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-xl font-bold">楽動羽球 預約系統</h1>
                    <p className="text-sm text-slate-300 mt-1">{userRecord.name}，歡迎！</p>
                    <div className="mt-2 inline-block bg-amber-500 text-slate-900 text-xs font-bold px-2 py-1 rounded shadow-sm">
                      {LEVEL_NAMES[userLevel]} 會員
                    </div>
                  </div>
                  {profile.pictureUrl && <img src={profile.pictureUrl} className="w-12 h-12 rounded-full border-2 border-slate-600 shadow-md" />}
                </div>
              </div>

              {/* 行事曆區塊 */}
              <div className="bg-white px-4 py-4 shadow-sm border-b">
                <div className="flex justify-between items-center mb-4 px-2">
                    <button onClick={prevMonth} className="font-bold text-gray-500 hover:text-emerald-600 px-3 py-1 bg-gray-100 rounded">&lt;</button>
                    <div className="font-bold text-lg text-gray-800">{year}年 {month + 1}月</div>
                    <button onClick={nextMonth} className="font-bold text-gray-500 hover:text-emerald-600 px-3 py-1 bg-gray-100 rounded">&gt;</button>
                </div>
                <div className="grid grid-cols-7 text-center text-xs font-bold text-gray-400 mb-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div className="grid grid-cols-7 text-center gap-y-2">
                    {allCells.map((day, i) => {
                      if (!day) return <div key={i} className="h-10"></div>;
                      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                      
                      const hasGroupClass = slots.some(s => doesSlotMatchDate(s, dateStr) && s.remaining > 0 && !s.title.startsWith('[專屬教練課]'));
                      const hasCoachSlot = slots.some(s => doesSlotMatchDate(s, dateStr) && s.remaining > 0 && s.title.startsWith('[專屬教練課]'));
                      
                      const isSelected = dateStr === selectedDate;
                      const isToday = dateStr === formatDate(new Date());

                      return (
                        <div key={i} onClick={() => setSelectedDate(dateStr)} className="h-14 flex flex-col items-center justify-start cursor-pointer">
                          <div className={`w-8 h-8 flex items-center justify-center rounded-full text-sm transition-colors ${isSelected ? 'bg-emerald-600 text-white font-bold shadow-md' : isToday ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-gray-700 hover:bg-gray-100'}`}>
                            {day}
                          </div>
                          <div className="flex gap-1 mt-1">
                              {hasGroupClass && <div className="w-1.5 h-1.5 bg-amber-500 rounded-full"></div>}
                              {hasCoachSlot && <div className="w-1.5 h-1.5 bg-indigo-500 rounded-full"></div>}
                          </div>
                        </div>
                      )
                    })}
                </div>
              </div>

              {/* 課程列表區塊 */}
              <div className="p-4">
                <h3 className="font-bold text-gray-800 mb-3 ml-1">
                    {new Date(selectedDate).getMonth() + 1}月{new Date(selectedDate).getDate()}日 ({getDayOfWeek(selectedDate)}) 可預約時段
                </h3>
                
                {dailySlots.length === 0 ? (
                    <div className="text-center text-gray-400 py-8 bg-white rounded-xl border border-dashed">本日無可預約的時段</div>
                ) : (
                    <div className="space-y-4">
                        {dailySlots.map(slot => {
                          const isCoachSlot = slot.title.startsWith('[專屬教練課]');

                          if (isCoachSlot) {
                              const match = slot.title.match(/1v1:(\d+)\|1v2:(\d+)/);
                              const base1v1 = match ? parseInt(match[1]) : 1000;
                              const base1v2 = match ? parseInt(match[2]) : 1500;
                              const discount = getVIPDiscount(userLevel);
                              const my1v1 = Math.round(base1v1 * discount);
                              const my1v2 = Math.round(base1v2 * discount);

                              return (
                                <div key={slot.id} className="border p-4 rounded-xl flex flex-col shadow-sm transition bg-indigo-50 border-l-4 border-l-indigo-500 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 bg-indigo-200 text-indigo-800 text-[10px] px-2 py-1 rounded-bl-lg font-bold tracking-wide">教練開放時段</div>
                                    <div className="font-bold text-lg text-indigo-800 mt-1">教練專屬時段</div>
                                    <div className="font-semibold text-gray-800 mt-1 text-sm">{slot.date}</div>
                                    <div className="text-sm text-gray-500 mt-1">{slot.time} • {slot.location}</div>
                                    
                                    <div className="mt-4 pt-3 border-t border-indigo-100 flex flex-col gap-2.5">
                                        <div className="flex justify-between items-center bg-white p-2.5 rounded border border-indigo-100 shadow-sm">
                                            <div>
                                                <span className="font-bold text-indigo-700 text-sm">1對1 教練課</span>
                                                <div className="mt-0.5">
                                                    <span className="text-emerald-600 font-bold">NT$ {my1v1}</span>
                                                    {Number(userLevel) > 1 && <span className="text-gray-400 line-through text-xs ml-2">NT$ {base1v1}</span>}
                                                </div>
                                            </div>
                                            <button onClick={() => handleBook(slot, '1對1', my1v1)} disabled={status==='booking'} className="bg-indigo-600 text-white font-bold py-1.5 px-4 rounded-lg hover:bg-indigo-700 text-sm transition-colors">預約 1對1</button>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-2.5 rounded border border-indigo-100 shadow-sm">
                                            <div>
                                                <span className="font-bold text-indigo-700 text-sm">1對2 教練課</span>
                                                <div className="mt-0.5">
                                                    <span className="text-emerald-600 font-bold">NT$ {my1v2}</span>
                                                    {Number(userLevel) > 1 && <span className="text-gray-400 line-through text-xs ml-2">NT$ {base1v2}</span>}
                                                </div>
                                            </div>
                                            <button onClick={() => handleBook(slot, '1對2', my1v2)} disabled={status==='booking'} className="bg-indigo-600 text-white font-bold py-1.5 px-4 rounded-lg hover:bg-indigo-700 text-sm transition-colors">預約 1對2</button>
                                        </div>
                                    </div>
                                </div>
                              );
                          }

                          // 一般團課 (加入 4 或 5 堂的標示)
                          const originalPrice = slot.prices[1]; 
                          const myPrice = slot.prices[userLevel]; 
                          const isDiscounted = userLevel > 1 && myPrice < originalPrice; 

                          return (
                            <div key={slot.id} className="border p-4 rounded-xl flex flex-col hover:shadow-md transition bg-white border-l-4 border-l-emerald-500 relative overflow-hidden">
                              {slot.title.includes('[月繳') && <div className="absolute top-0 right-0 bg-amber-100 text-amber-800 text-[10px] px-2 py-1 rounded-bl-lg font-bold">套裝課程</div>}
                              
                              <div className="flex justify-between items-start mt-1">
                                <div className="w-3/4">
                                  <div className="font-bold text-lg text-emerald-700">{slot.title}</div>
                                  <div className="font-semibold text-gray-800 mt-1 text-sm leading-relaxed">{slot.date}</div>
                                  <div className="text-sm text-gray-500 mt-1">{slot.time} • {slot.location}</div>
                                </div>
                                <button onClick={() => handleBook(slot)} disabled={status==='booking'} className="bg-emerald-600 text-white font-bold py-2 px-5 rounded-lg hover:bg-emerald-700 shadow-sm transition-colors">預約</button>
                              </div>
                              
                              <div className="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between w-full">
                                <div className="flex items-baseline gap-2">
                                  {isDiscounted ? (
                                    <>
                                      <span className="text-emerald-600 font-bold text-lg">NT$ {myPrice}</span>
                                      <span className="text-gray-400 line-through text-sm">NT$ {originalPrice}</span>
                                      <span className="bg-red-50 text-red-600 border border-red-200 text-[10px] px-1.5 py-0.5 rounded font-bold">專屬特價</span>
                                    </>
                                  ) : (
                                    <span className="text-emerald-600 font-bold text-lg">NT$ {myPrice}</span>
                                  )}
                                </div>
                                <span className="text-xs font-medium text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full">剩餘 {slot.remaining} 名額</span>
                              </div>
                            </div>
                          );
                        })}
                    </div>
                )}
              </div>
            </div>
          );
        };

        // --- 教練：後台管理 ---
        const CoachDashboard = () => {
          const [form, setForm] = useState({ 
            mode: 'single', 
            title: '新手團課',
            location: '關聖里活動中心',
            date: '', 
            startTime: '19:00',
            endTime: '21:00', 
            capacity: '6', 
            prices: { 1: 300, 2: 294, 3: 285, 4: 270, 5: 264 },
            coachBase1v1: '1000',
            coachBase1v2: '1500'
          });
          const [bookings, setBookings] = useState([]);
          const [slots, setSlots] = useState([]);
          const [loading, setLoading] = useState(false);

          const monthlyInfo = getMonthlyDatesInfo(form.date); // 即時計算當月堂數

          const fetchData = () => {
            Promise.all([
                fetchAPI({ action: 'getCoachData' }),
                fetchAPI({ action: 'getSlots' })
            ]).then(([bookRes, slotsRes]) => {
                setBookings(bookRes.bookings || []);
                setSlots(slotsRes.slots || []);
            });
          };

          useEffect(() => { fetchData(); }, []);

          const handleAddSlot = async (e) => {
            e.preventDefault();
            setLoading(true);
            
            let finalTitle = form.title;
            let finalCapacity = form.capacity;

            if (form.mode === 'monthly') {
                finalTitle = `[月繳${monthlyInfo.count}堂] ${form.title}`; // 自動填入 4 堂或 5 堂
            } else if (form.mode === 'coach') {
                finalTitle = `[專屬教練課] 1v1:${form.coachBase1v1}|1v2:${form.coachBase1v2}`;
                finalCapacity = 1; 
            }

            const finalDate = form.mode === 'monthly' 
                ? monthlyInfo.text 
                : `${form.date} (${getDayOfWeek(form.date)})`;
            
            const formattedTime = `${form.startTime} - ${form.endTime}`;

            await fetchAPI({ 
                action: 'addSlot', 
                ...form, 
                capacity: finalCapacity,
                title: finalTitle,
                date: finalDate, 
                time: formattedTime 
            });

            alert('課程上架成功！');
            setForm({...form, date: ''}); 
            fetchData();
            setLoading(false);
          };

          const updatePrice = (level, value) => {
            const val = parseInt(value, 10) || 0;
            if (Number(level) === 1) {
              setForm(prev => ({
                ...prev,
                prices: {
                  1: val,
                  2: Math.round(val * getVIPDiscount(2)), 
                  3: Math.round(val * getVIPDiscount(3)), 
                  4: Math.round(val * getVIPDiscount(4)), 
                  5: Math.round(val * getVIPDiscount(5))  
                }
              }));
            } else {
              setForm(prev => ({ ...prev, prices: { ...prev.prices, [level]: val }}));
            }
          };

          return (
            <div className="max-w-6xl mx-auto p-6">
              <h1 className="text-3xl font-bold text-slate-800 mb-8">教練管理後台</h1>
              <div className="grid md:grid-cols-3 gap-6">
                
                {/* 左側：新增表單 */}
                <div className="bg-white p-6 rounded-xl shadow-sm border col-span-1 h-fit">
                  <h2 className="font-bold text-lg mb-4 border-b pb-2">新增課程 / 開放時段</h2>
                  <form onSubmit={handleAddSlot} className="space-y-4">
                    
                    <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                        <label className="block text-sm mb-2 font-bold text-emerald-800">上架類型</label>
                        <div className="flex flex-col gap-2">
                            <label className="flex items-center text-sm cursor-pointer hover:bg-emerald-100 p-1 rounded transition">
                                <input type="radio" name="mode" className="mr-2" 
                                    checked={form.mode === 'single'} 
                                    onChange={() => setForm({...form, mode: 'single'})} /> 單堂團課
                            </label>
                            <label className="flex items-center text-sm cursor-pointer hover:bg-emerald-100 p-1 rounded transition">
                                <input type="radio" name="mode" className="mr-2" 
                                    checked={form.mode === 'monthly'} 
                                    onChange={() => setForm({...form, mode: 'monthly'})} /> 月繳團課 (依當月週數)
                            </label>
                            <label className="flex items-center text-sm cursor-pointer hover:bg-emerald-100 p-1 rounded transition">
                                <input type="radio" name="mode" className="mr-2" 
                                    checked={form.mode === 'coach'} 
                                    onChange={() => setForm({...form, mode: 'coach'})} /> 開放教練時段 (1對1/1對2)
                            </label>
                        </div>
                    </div>

                    {form.mode !== 'coach' && (
                        <div>
                            <label className="block text-sm mb-1 text-gray-700">課程名稱</label>
                            <select className="w-full border p-2 rounded bg-white outline-none" value={form.title} onChange={e=>setForm({...form, title: e.target.value})}>
                                <option value="新手團課">新手團課</option>
                                <option value="初階團課">初階團課</option>
                                <option value="兒童團課">兒童團課</option>
                            </select>
                        </div>
                    )}

                    <div>
                        <label className="block text-sm mb-1 text-gray-700">地點</label>
                        <select className="w-full border p-2 rounded bg-white outline-none" value={form.location} onChange={e=>setForm({...form, location: e.target.value})}>
                            <option value="關聖里活動中心">關聖里活動中心</option>
                            <option value="永康嘉世">永康嘉世</option>
                            <option value="仁德羽潮">仁德羽潮</option>
                            <option value="南區羽潮">南區羽潮</option>
                        </select>
                    </div>
                    
                    <div>
                        <label className="block text-sm mb-1 text-gray-700">
                            {form.mode === 'monthly' ? '選擇當月任一上課日' : '開放日期'}
                        </label>
                        <input type="date" required className="w-full border p-2 rounded" value={form.date} onChange={e=>setForm({...form, date: e.target.value})} />
                        {form.mode === 'monthly' && form.date && (
                            <div className="mt-2 text-xs text-emerald-600 bg-emerald-50 p-2 rounded">
                                將自動建立：{monthlyInfo.text} (共 {monthlyInfo.count} 堂)
                            </div>
                        )}
                    </div>

                    <div className="flex gap-2 items-center">
                        <div className="flex-1">
                            <label className="block text-sm mb-1 text-gray-700">開始時間</label>
                            <select className="w-full border p-2 rounded bg-white" value={form.startTime} onChange={e=>setForm({...form, startTime: e.target.value})}>
                                {timeOptions.map(t => <option key={`start-${t}`} value={t}>{t}</option>)}
                            </select>
                        </div>
                        <span className="pt-5 text-gray-400">至</span>
                        <div className="flex-1">
                            <label className="block text-sm mb-1 text-gray-700">結束時間</label>
                            <select className="w-full border p-2 rounded bg-white" value={form.endTime} onChange={e=>setForm({...form, endTime: e.target.value})}>
                                {timeOptions.map(t => <option key={`end-${t}`} value={t}>{t}</option>)}
                            </select>
                        </div>
                    </div>

                    {form.mode !== 'coach' ? (
                        <>
                            <div>
                                <label className="block text-sm mb-1 text-gray-700">總名額</label>
                                <input type="number" required min="1" className="w-full border p-2 rounded" value={form.capacity} onChange={e=>setForm({...form, capacity: e.target.value})} />
                            </div>

                            <div className="bg-gray-50 p-3 rounded border space-y-2 mt-4">
                              <h3 className="text-sm font-bold text-gray-700">
                                {form.mode === 'monthly' ? `各等級 ${monthlyInfo.count || 4} 堂總收費 (NT$)` : '各等級單堂收費 (NT$)'}
                              </h3>
                              <p className="text-[11px] text-emerald-600 bg-emerald-50 p-1.5 rounded mb-2">
                                💡 只要修改「普通」價格，系統就會自動算出優惠。
                              </p>
                              {[1,2,3,4,5].map(lvl => (
                                <div key={lvl} className="flex items-center text-sm">
                                  <span className="w-16 font-semibold text-gray-600">{LEVEL_NAMES[lvl]}</span>
                                  <input type="number" required min="0" className="flex-1 border p-1 rounded px-2" value={form.prices[lvl]} onChange={e=>updatePrice(lvl, e.target.value)} />
                                </div>
                              ))}
                            </div>
                        </>
                    ) : (
                        <div className="bg-indigo-50 p-3 rounded border border-indigo-100 space-y-3 mt-4">
                            <h3 className="text-sm font-bold text-indigo-800">專屬教練課收費設定 (基準價)</h3>
                            <p className="text-[11px] text-indigo-600 mb-2 leading-relaxed">
                                💡 總名額將自動鎖定為 1 組。<br/>學生預約時，系統會自動依此基準價換算對應的 VIP 折扣。
                            </p>
                            <div className="flex items-center text-sm gap-2">
                                <span className="w-20 font-semibold text-indigo-900">1對1 基準價</span>
                                <input type="number" required min="0" className="flex-1 border p-1.5 rounded px-2" value={form.coachBase1v1} onChange={e=>setForm({...form, coachBase1v1: e.target.value})} />
                            </div>
                            <div className="flex items-center text-sm gap-2">
                                <span className="w-20 font-semibold text-indigo-900">1對2 基準價</span>
                                <input type="number" required min="0" className="flex-1 border p-1.5 rounded px-2" value={form.coachBase1v2} onChange={e=>setForm({...form, coachBase1v2: e.target.value})} />
                            </div>
                        </div>
                    )}

                    <button type="submit" disabled={loading} className="w-full bg-slate-800 text-white p-3 rounded font-bold mt-2">上架時段</button>
                  </form>
                </div>

                {/* 右側：資料檢視區 */}
                <div className="col-span-2 space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                            <h2 className="font-bold text-lg text-emerald-700">所有已開課程 (狀態總覽)</h2>
                            <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">共 {slots.length} 堂</span>
                        </div>
                        <div className="overflow-x-auto max-h-[300px] overflow-y-auto">
                          <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="sticky top-0 bg-white shadow-sm"><tr className="text-gray-600">
                              <th className="p-3">課程名稱</th>
                              <th className="p-3">日期 / 時間</th>
                              <th className="p-3 text-center">預約進度</th>
                            </tr></thead>
                            <tbody>
                              {slots.length === 0 ? (
                                  <tr><td colSpan="3" className="p-4 text-center text-gray-400">尚無開課紀錄</td></tr>
                              ) : (
                                  slots.map((s, idx) => {
                                    const booked = s.capacity - s.remaining;
                                    const isFull = booked === s.capacity;
                                    const isCoachSlot = s.title.startsWith('[專屬教練課]');
                                    const displayTitle = isCoachSlot ? '教練開放時段' : s.title;

                                    return (
                                      <tr key={idx} className="border-b hover:bg-gray-50">
                                        <td className="p-3">
                                            <span className="font-bold text-gray-800">{displayTitle}</span>
                                            {isCoachSlot && <span className="ml-2 text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold tracking-wide">1對1/1對2</span>}
                                        </td>
                                        <td className="p-3 text-gray-500">{s.date} <br/><span className="text-xs">{s.time}</span></td>
                                        <td className="p-3 text-center">
                                            <span className={`px-3 py-1 rounded-full font-bold text-xs ${isFull ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-700'}`}>
                                                {booked} / {s.capacity}
                                            </span>
                                        </td>
                                      </tr>
                                    )
                                  })
                              )}
                            </tbody>
                          </table>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border">
                      <h2 className="font-bold text-lg mb-4 border-b pb-2 text-slate-800">最新學生預約名單</h2>
                      <div className="overflow-x-auto max-h-[300px] overflow-y-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                          <thead className="sticky top-0 bg-white shadow-sm"><tr className="text-gray-600">
                            <th className="p-3">時段 ID</th>
                            <th className="p-3">學生姓名 (方案)</th>
                            <th className="p-3">實收金額</th>
                          </tr></thead>
                          <tbody>
                            {bookings.length === 0 ? (
                                <tr><td colSpan="3" className="p-4 text-center text-gray-400">目前尚無預約資料</td></tr>
                            ) : (
                                bookings.slice().reverse().map((b, idx) => ( 
                                  <tr key={idx} className="border-b hover:bg-gray-50">
                                    <td className="p-3 font-mono text-xs text-gray-400">{b.slotId}</td>
                                    <td className="p-3 font-bold text-gray-800">{b.name}</td>
                                    <td className="p-3 text-emerald-600 font-bold">NT$ {b.paidPrice}</td>
                                  </tr>
                                ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
